    .profile-section { background: #fff; border: 1px solid #e8e4d8; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; }

    @media (max-width: 600px) { .two-col, .vax-add-row { grid-template-columns: 1fr; } }

<body>

  <div class="topbar">
<a class="brand" href="/" style="text-decoration: none; color: inherit;">Tether</a>    <div class="topbar-right">
      <div class="live-tag">Live data</div>
      <button class="signout-btn" onclick="db.auth.signOut().then(() => location.replace('/login'))">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <h1 style="font-size: 28px; margin-bottom: 4px;">Shelter &amp; Rescue Dashboard</h1>
    <p style="font-size: 14px; color: #6a706a; margin-bottom: 24px;">Matching engine v0.3 · vetted fosters only</p>

  <!-- ADD A DOG MODAL -->

      </div>
      <div class="two-col">
        <div class="field"><label>Experience needed</label>
          <select id="d-exp"><option>first-time</option><option selected>some</option><option>experienced</option></select></div>
        <div class="field"><label>Urgency</label>
          <select id="d-urgency"><option value="">None</option><option value="medical">Medical</option><option value="kennel stress">Kennel stress</option><option value="capacity">Capacity emergency</option></select></div>

  <!-- FOSTER PROFILE MODAL -->
  <div class="modal-bg" id="profile-bg">
    <div class="modal">
      <div id="profile-content"></div>
      <div class="modal-actions">
        <button class="cancel-btn" style="flex:1;" onclick="closeProfile()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const TODAY = new Date();
    let dogsData = [], fostersData = [], vaxData = [], matchesData = [], sheltersData = [];

    async function loadAll() {
      const [dogsRes, fostersRes, vaxRes, matchesRes, sheltersRes] = await Promise.all([
        db.from('dogs').select('*').order('created_at', { ascending: false }),
        db.from('fosters').select('*'),
        db.from('vaccinations').select('*'),
        db.from('matches').select('*'),
        db.from('shelters').select('*')
      ]);
      dogsData = dogsRes.data || [];
      fostersData = fostersRes.data || [];
      vaxData = vaxRes.data || [];
      matchesData = matchesRes.data || [];
      sheltersData = sheltersRes.data || [];
      render();
    }

    function hardFilter(dog, f) {
      const kidsPresent = (f.kids && f.kids !== 'No kids' && f.kids !== 'Teens only') || f.visitor_kids;
      const dogsPresent = (f.has_dogs && f.has_dogs !== 'None') || f.visitor_dogs;
      const catsPresent = (f.has_cats && f.has_cats !== 'None') || f.visitor_cats;
      if (!dog.ok_kids && kidsPresent) return "kids";
      if (!dog.ok_cats && catsPresent) return "cats";
      if (!dog.ok_dogs && dogsPresent) return "dogs";
      if (f.allergies) return "allergies";
      if (f.landlord_ok === 'No') return "landlord";
      return null;
    }

    function softScore(dog, f) {
      let pts = 0;
      const energyPref = f.energy_pref || 3;
      const eDiff = Math.abs((dog.energy || 3) - energyPref);
      pts += Math.max(0, 15 - eDiff * 5);
      const aloneMap = { '0-2': 1, '2-4': 3, '4-6': 5, '6-8': 7, '8+': 9 };
      const fAlone = aloneMap[f.alone_hours] || 5;
      pts += (fAlone <= (dog.alone_tolerance || 4)) ? 10 : Math.max(0, 10 - (fAlone - dog.alone_tolerance) * 3);
      pts += 25;
      const sizeOk = !f.size_pref || f.size_pref === 'No preference' || f.size_pref.toLowerCase() === dog.size;
      pts += sizeOk ? 12 : 6;
      pts += 8;
      const rank = { "first-time": 1, "some": 2, "experienced": 3, "professional": 3 };
      pts += (rank[f.training] || 1) >= (rank[dog.exp_needed] || 1) ? 15 : 7;
      const gOk = !f.gender_pref || f.gender_pref === 'No preference' || f.gender_pref[0] === dog.gender;
      pts += gOk ? 5 : 2;
      const ageBand = dog.age <= 1 ? "Puppy" : dog.age <= 3 ? "Young" : dog.age <= 8 ? "Adult" : "Senior";
      const aOk = !f.age_pref || f.age_pref === 'No preference' || f.age_pref.startsWith(ageBand);
      pts += aOk ? 5 : 2;
      return Math.min(100, Math.round(pts));
    }

    function matchesFor(dog) {
      const threshold = dog.urgency ? 60 : 75;
      return fostersData
        .filter(f => f.vet_status === 'vetted')
        .map(f => {
          if (hardFilter(dog, f)) return null;
          let score = softScore(dog, f);
          let boosted = false;
          if (dog.urgency && f.emergency) { score = Math.min(100, score + 5); boosted = true; }
          return { foster: f, score, boosted };
        })
        .filter(m => m && m.score >= threshold)
        .sort((a, b) => b.score - a.score);
    }

    function fosterForDog(dogId) {
      const m = matchesData.find(x => x.dog_id === dogId && (x.status === 'placed' || x.status === 'finished'));
      if (!m) return null;
      return fostersData.find(f => f.id === m.foster_id) || null;
    }

    async function setVetStatus(fosterId, status) {
      const { data: { session } } = await db.auth.getSession();
      await db.from('fosters').update({
        vet_status: status,
        vetted_by: session?.user?.email || 'unknown',
        vetted_at: new Date().toISOString()
      }).eq('id', fosterId);
      closeProfile();
      loadAll();
    }

async function setDogStatus(dogId, status, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      await db.from('dogs').update({ status }).eq('id', dogId);
      if (status === 'adopted' || status === 'available') {
        // close out any active placement match for this dog
        await db.from('matches').update({ status: 'finished' })
          .eq('dog_id', dogId).eq('status', 'placed');
      }
      loadAll();
    }

    const LIFECYCLE = ['matched', 'contacted', 'placed', 'finished'];
    async function advanceMatch(dogId, fosterId, currentStatus) {
      const next = LIFECYCLE[(LIFECYCLE.indexOf(currentStatus) + 1) % LIFECYCLE.length];
      const { data: existing } = await db.from('matches')
        .select('id').eq('dog_id', dogId).eq('foster_id', fosterId).maybeSingle();
      if (existing) {
        await db.from('matches').update({ status: next }).eq('id', existing.id);
      } else {
        await db.from('matches').insert({ dog_id: dogId, foster_id: fosterId, status: next });
      }
      if (next === 'placed') await db.from('dogs').update({ status: 'placed' }).eq('id', dogId);
      loadAll();
    }

    function vaxStatus(expires) {
      if (!expires) return { cls: "vax-ok", label: "no expiry set" };
      const days = Math.floor((new Date(expires) - TODAY) / 86400000);
      if (days < 0) return { cls: "vax-expired", label: "EXPIRED " + Math.abs(days) + "d ago" };
      if (days <= 30) return { cls: "vax-soon", label: "expires in " + days + "d" };
      return { cls: "vax-ok", label: "current" };
    }

    function vaxBlock(dogId) {
      const dogVax = vaxData.filter(v => v.dog_id === dogId);
      if (!dogVax.length) return '';
      return `<div class="vax"><div class="vax-title">Vaccinations</div>
        ${dogVax.map(v => { const s = vaxStatus(v.expires); return `<div class="vax-row"><span style="font-weight:600;">${v.name}</span><span style="color:#6a706a;">${v.expires || '—'} · <span class="${s.cls}">${s.label}</span></span></div>`; }).join('')}
      </div>`;
    }

    // ---------- FOSTER PROFILE PANEL (Piece 3) ----------
    function openProfile(fosterId) {
      const f = fostersData.find(x => x.id === fosterId);
      if (!f) return;
      const shelter = sheltersData.find(s => s.id === f.shelter_id);
      const history = matchesData
        .filter(m => m.foster_id === f.id)
        .map(m => {
          const dog = dogsData.find(d => d.id === m.dog_id);
          return dog ? `<div class="ps-line">${dog.name} <span>· ${m.status}</span></div>` : '';
        }).join('') || '<div class="ps-line"><span>No dog history yet.</span></div>';
      const vetTag = f.vet_status === 'vetted' ? '<span class="vet-tag vt-vetted">Vetted</span>'
        : f.vet_status === 'declined' ? '<span class="vet-tag vt-declined">Declined</span>'
        : '<span class="vet-tag vt-pending">Pending</span>';

      document.getElementById('profile-content').innerHTML = `
        <h2 style="margin-bottom:4px;">${f.name || 'Unnamed'} ${vetTag}</h2>
        <p style="font-size:13px; color:#6a706a; margin-bottom:16px;">
          ${shelter ? 'Signed up with ' + shelter.name : 'No rescue selected'}
          ${f.vetted_by ? ' · reviewed by ' + f.vetted_by + (f.vetted_at ? ' on ' + f.vetted_at.slice(0,10) : '') : ''}
        </p>
        <div class="profile-section">
          <div class="ps-title">Contact</div>
          <div class="ps-line">${f.email || '—'} <span>· ${f.phone || 'no phone'}</span></div>
          <div class="ps-line"><span>${f.city || '?'}, ${f.state || '?'} ${f.zip || ''}</span></div>
        </div>
        <div class="profile-section">
          <div class="ps-title">Home</div>
          <div class="ps-line">${f.housing || '?'} <span>· ${f.yard || 'yard unknown'} · ${f.rent_own === 'rent' ? 'Rents (landlord: ' + (f.landlord_ok || '?') + ')' : 'Owns'}</span></div>
          <div class="ps-line"><span>Insurance restrictions: ${f.insurance_restrictions || 'not answered'}</span></div>
        </div>
        <div class="profile-section">
          <div class="ps-title">Household</div>
          <div class="ps-line"><span>Kids: ${f.kids || '?'} · Dogs: ${f.has_dogs || '?'} · Cats: ${f.has_cats || '?'} · Other: ${f.other_pets || 'none'}</span></div>
          <div class="ps-line"><span>Allergies: ${f.allergies ? 'YES' : 'no'} · Visitors: ${[f.visitor_kids && 'kids', f.visitor_dogs && 'dogs', f.visitor_cats && 'cats'].filter(Boolean).join(', ') || 'none regular'}</span></div>
        </div>
        <div class="profile-section">
          <div class="ps-title">Experience &amp; lifestyle</div>
          <div class="ps-line"><span>Fostered: ${f.foster_count || '?'} · Training: ${f.training || '?'} · Medical exp: ${f.medical_exp ? 'yes' : 'no'} · Behavioral exp: ${f.behavioral_exp ? 'yes' : 'no'}</span></div>
          <div class="ps-line"><span>Rehomed before: ${f.rehomed_before || 'not answered'}</span></div>
          <div class="ps-line"><span>Away ${f.alone_hours || '?'}h/day · Exercise: ${f.exercise || '?'} · Energy pref ${f.energy_pref || '?'}/5 · ${f.schedule || 'schedule unknown'}</span></div>
        </div>
        <div class="profile-section">
          <div class="ps-title">Care plans</div>
          <div class="ps-line"><span>Day/night: ${f.day_night_plan || '—'} · Travel: ${f.travel_plan || '—'}</span></div>
          <div class="ps-line"><span>Vet: ${f.vet_contact || 'not provided'} · Food cost: ${f.food_cost_ok ? 'will provide' : 'ask rescue'}</span></div>
          ${f.notes ? '<div class="ps-line"><span>Notes: ' + f.notes + '</span></div>' : ''}
        </div>
        <div class="profile-section">
          <div class="ps-title">Dog history</div>
          ${history}
        </div>
        ${f.vet_status === 'pending' ? `
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="approve-btn" style="flex:1;" onclick="setVetStatus('${f.id}', 'vetted')">Approve</button>
          <button class="decline-btn" style="flex:1;" onclick="setVetStatus('${f.id}', 'declined')">Decline</button>
        </div>` : ''}
      `;
      document.getElementById('profile-bg').style.display = 'flex';
    }
    function closeProfile() { document.getElementById('profile-bg').style.display = 'none'; }

    function render() {
      const pending = fostersData.filter(f => f.vet_status === 'pending');
      const vetted = fostersData.filter(f => f.vet_status === 'vetted');
      const available = dogsData.filter(d => !d.status || d.status === 'available');
      const fostered = dogsData.filter(d => d.status === 'placed');
      const adopted = dogsData.filter(d => d.status === 'adopted');
      const vaxAlerts = vaxData.filter(v => {
        if (!v.expires) return false;
        const dog = dogsData.find(d => d.id === v.dog_id);
        if (dog && dog.status === 'adopted') return false;
        return Math.floor((new Date(v.expires) - TODAY) / 86400000) <= 30;
      }).length;

      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${available.length}</div><div class="label">Available</div></div>
        <div class="stat"><div class="num">${fostered.length}</div><div class="label">In foster</div></div>
        <div class="stat"><div class="num">${vetted.length}</div><div class="label">Vetted fosters</div></div>
        <div class="stat"><div class="num">${pending.length}</div><div class="label">Pending review</div></div>
        <div class="stat"><div class="num">${vaxAlerts}</div><div class="label">Vax alerts</div></div>`;

      document.getElementById("pending").innerHTML = pending.length === 0
        ? `<div class="empty-state">No pending foster signups. New signups from the website appear here for review.</div>`
        : pending.map(f => {
          const shelter = sheltersData.find(s => s.id === f.shelter_id);
          return `
          <div class="pending-card">
            <div class="dog-head">
              <div>
                <div class="dog-name" style="font-size:16px;"><span class="foster-link" onclick="openProfile('${f.id}')">${f.name || 'Unnamed'}</span></div>
                <div class="pending-info">
                  ${shelter ? '<strong>' + shelter.name + '</strong> · ' : ''}${f.city || '?'}, ${f.state || '?'} · ${f.housing || '?'}<br>
                  Kids: ${f.kids || '?'} · Dogs: ${f.has_dogs || '?'} · Cats: ${f.has_cats || '?'} · Allergies: ${f.allergies ? 'YES' : 'no'}<br>
                  <span style="color:#8a908a;">Click name for full profile</span>
                </div>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="approve-btn" onclick="setVetStatus('${f.id}', 'vetted')">Approve</button>
                <button class="decline-btn" onclick="setVetStatus('${f.id}', 'declined')">Decline</button>
              </div>
            </div>
          </div>`;
        }).join('');

      document.getElementById("dogs-available").innerHTML = available.length === 0
        ? `<div class="empty-state">No available dogs. Click "+ Add a dog" to add one — matches compute instantly.</div>`
        : available.map(dog => {
          const list = matchesFor(dog);
          return `
          <div class="dog-card">
            <div class="dog-head">
              <div>
                <div class="dog-name">${dog.name}</div>
                <div class="dog-meta">${dog.size || '?'} · ${dog.gender || '?'} · age ${dog.age ?? '?'} · energy ${dog.energy ?? '?'}/5 · ok alone ${dog.alone_tolerance ?? '?'}h · needs ${dog.exp_needed || '?'} foster</div>
                ${dog.bio ? `<div class="dog-bio">${dog.bio}</div>` : ''}
              </div>
              <span class="badge ${dog.urgency ? "urgent" : "standard"}">${dog.urgency ? "URGENT — " + dog.urgency : "Standard"}</span>
            </div>
            ${vaxBlock(dog.id)}
            <div class="matches">
              <div class="matches-label">Matches above ${dog.urgency ? 60 : 75}% (vetted fosters only)</div>
              ${list.length === 0
                ? `<div class="no-match">No vetted fosters above threshold yet.</div>`
                : list.map(m => {
                  const saved = matchesData.find(x => x.dog_id === dog.id && x.foster_id === m.foster.id);
                  const st = saved ? saved.status : 'matched';
                  const cls = { matched:'lc-matched', contacted:'lc-contacted', placed:'lc-placed', finished:'lc-finished' }[st];
                  return `
                  <div class="match-row">
                    <div class="match-info">
                      <div class="fname"><span class="foster-link" onclick="openProfile('${m.foster.id}')">${m.foster.name}</span> ${m.boosted ? '<span class="boost-tag">+5 emergency</span>' : ""}</div>
                      <div class="fdetail">${m.foster.city || '?'}, ${m.foster.state || '?'} · ${m.foster.housing || '?'} · ${m.foster.training || '?'} · away ${m.foster.alone_hours || '?'}h/day</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span class="score ${m.score >= 80 ? "high" : "mid"}">${m.score}</span>
                      <button class="lifecycle ${cls}" onclick="advanceMatch('${dog.id}','${m.foster.id}','${st}')">${st[0].toUpperCase() + st.slice(1)}</button>
                    </div>
                  </div>`;
                }).join('')}
            </div>
          </div>`;
        }).join('');

      document.getElementById("dogs-fostered").innerHTML = fostered.length === 0
        ? `<div class="empty-state">No dogs currently in foster homes.</div>`
        : fostered.map(dog => {
          const f = fosterForDog(dog.id);
          return `
          <div class="dog-card fostered">
            <div class="dog-head">
              <div>
                <div class="dog-name">${dog.name}</div>
                <div class="dog-meta">${dog.size || '?'} · ${dog.gender || '?'} · age ${dog.age ?? '?'}</div>
                <div class="foster-with">🏠 In foster with ${f ? `<span class="foster-link" onclick="openProfile('${f.id}')">${f.name}</span>` : 'unknown'}${f && f.city ? ' · ' + f.city + ', ' + (f.state || '') : ''}</div>
                ${dog.bio ? `<div class="dog-bio">${dog.bio}</div>` : ''}
              </div>
              <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
                <span class="badge infoster">In foster</span>
                <div style="display:flex; gap:6px;">
                  <button class="action-btn" onclick="setDogStatus('${dog.id}','available','Mark ${dog.name} as returned and available again?')">Mark returned</button>
                  <button class="action-btn dark" onclick="setDogStatus('${dog.id}','adopted','Mark ${dog.name} as adopted? 🎉')">Mark adopted</button>
                </div>
              </div>
            </div>
            ${vaxBlock(dog.id)}
          </div>`;
        }).join('');

      document.getElementById("dogs-adopted").innerHTML = adopted.length === 0
        ? `<div class="empty-state">No adoptions recorded yet. They'll live here forever when they happen. 🎉</div>`
        : adopted.map(dog => {
          const f = fosterForDog(dog.id);
          return `
          <div class="adopted-row">
            <div>
              <span class="aname">${dog.name}</span>
<span class="adetail"> · ${dog.size || '?'} · ${dog.gender || '?'} · age ${dog.age ?? '?'}${f ? ` · adopted via <span class="foster-link" onclick="openProfile('${f.id}')">${f.name}</span>` : ''}</span>            </div>
            <span class="badge lc-finished" style="background:#2a2e2a; color:#faf8f2;">Adopted 🎉</span>
          </div>`;
        }).join('');
    }

    function openModal() { document.getElementById('modal-bg').style.display = 'flex'; if (!document.querySelector('.vax-add-row')) addVaxRow(); }
    function closeModal() { document.getElementById('modal-bg').style.display = 'none'; }
    function addVaxRow() {
      const row = document.createElement('div');
      row.className = 'vax-add-row';
      row.innerHTML = `
        <div class="field" style="margin:0;"><label>Vaccine</label><input type="text" class="vx-name" placeholder="Rabies"></div>
        <div class="field" style="margin:0;"><label>Given</label><input type="date" class="vx-given"></div>
        <div class="field" style="margin:0;"><label>Expires</label><input type="date" class="vx-exp"></div>
        <button class="small-x" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById('vax-rows').appendChild(row);
    }
    async function saveDog() {
      const name = document.getElementById('d-name').value.trim();
      if (!name) { alert('Dog needs a name.'); return; }
      const btn = document.getElementById('save-dog');
      btn.disabled = true; btn.textContent = 'Saving...';
      const { data: dog, error } = await db.from('dogs').insert({
        name,
        age: parseInt(document.getElementById('d-age').value) || null,
        gender: document.getElementById('d-gender').value,
        size: document.getElementById('d-size').value,
        energy: parseInt(document.getElementById('d-energy').value) || 3,
        alone_tolerance: parseInt(document.getElementById('d-alone').value) || 4,
        ok_kids: document.getElementById('d-kids').checked,
        ok_cats: document.getElementById('d-cats').checked,
        ok_dogs: document.getElementById('d-dogs').checked,
        exp_needed: document.getElementById('d-exp').value,
        urgency: document.getElementById('d-urgency').value || null,
        bio: document.getElementById('d-bio').value.trim() || null
      }).select().single();
      if (error) { alert('Error saving: ' + error.message); btn.disabled = false; btn.textContent = 'Save dog'; return; }
      const vaxRows = [...document.querySelectorAll('.vax-add-row')]
        .map(r => ({
          dog_id: dog.id,
          name: r.querySelector('.vx-name').value.trim(),
          date_given: r.querySelector('.vx-given').value || null,
          expires: r.querySelector('.vx-exp').value || null
        }))
        .filter(v => v.name);
      if (vaxRows.length) await db.from('vaccinations').insert(vaxRows);
      btn.disabled = false; btn.textContent = 'Save dog';
      closeModal();
      document.querySelectorAll('#modal-bg input, #modal-bg textarea').forEach(el => { if (el.type === 'checkbox') el.checked = false; else el.value = ''; });
      document.getElementById('vax-rows').innerHTML = '';
      loadAll();
    }

    loadAll();
  </script>
</body>
</html>
