  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .vax-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
    .vax-ok { color: #1f7a36; font-weight: 600; }
    .vax-soon { color: #b07a1f; font-weight: 600; }
    .vax-expired { color: #b02a2a; font-weight: 700; }
    .matches { margin-top: 14px; border-top: 1px solid #f0ecdf; padding-top: 12px; }
    .matches-label { font-size: 11px; font-weight: 600; color: #6a706a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .match-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f6f3ea; gap: 10px; flex-wrap: wrap; }
    .match-row:last-child { border-bottom: none; }
    .match-info .fname { font-size: 14px; font-weight: 600; }
    .match-info .fdetail { font-size: 12px; color: #6a706a; }
    .score { font-family: "Fraunces", serif; font-weight: 700; font-size: 16px; }
    .score.high { color: #1f7a36; }
    .score.mid { color: #8a6d1f; }
    .no-match, .empty-state { font-size: 13px; color: #8a908a; font-style: italic; }
    .empty-state { background: #fff; border: 1px dashed #d8d4c8; border-radius: 16px; padding: 28px; text-align: center; }
    .boost-tag { font-size: 10px; background: #fde9d2; color: #8a521f; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .approve-btn, .decline-btn { font-size: 12px; font-weight: 600; padding: 7px 16px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; }

    .decline-btn { background: #fde2e2; color: #8a1f1f; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(42,46,42,0.5); z-index: 50; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 16px; }
    .modal { background: #faf8f2; border-radius: 18px; max-width: 560px; width: 100%; padding: 28px; }
    .modal h2 { font-size: 22px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #d8d4c8; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff;

    .field textarea { min-height: 70px; resize: vertical; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .check-line label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .vax-add-row { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr auto; gap: 8px; margin-bottom: 8px; align-items: end; }
    .small-x { background: transparent; border: 1px solid #d8d4c8; border-radius: 8px; cursor: pointer; padding: 8px 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .cancel-btn { background: transparent; border: 1px solid #d8d4c8; color: #4a504a; font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 999px; cursor: pointer; font-family: inherit; flex: 1; }
    .save-btn { background: #2a2e2a; color: #faf8f2; font-size: 14px; font-weight: 600; padding: 12px 20px; border: none; border-radius: 999px; cursor: pointer; font-family: inherit; flex: 2; }
    .save-btn:disabled { background: #8a908a; }
    .footer-note { text-align: center; font-size: 12px; color: #8a908a; margin-top: 32px; }
    @media (max-width: 600px) { .three-col, .two-col, .vax-add-row { grid-template-columns: 1fr; } }
  </style>

<body>

  <div class="topbar">
    <div class="brand">Tether</div>
    <div class="topbar-right">
      <div class="live-tag">Live data</div>
      <button class="signout-btn" onclick="db.auth.signOut().then(() => location.replace('/login'))">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <h1 style="font-size: 28px; margin-bottom: 4px;">Shelter Dashboard</h1>
    <p style="font-size: 14px; color: #6a706a; margin-bottom: 24px;">Matching engine v0.2 · vetted fosters only</p>

    <div class="stats" id="stats"></div>

    <div class="section-head">
      <h2>Pending foster reviews</h2>
    </div>
    <div id="pending"></div>

    <div class="section-head">
      <h2>Dogs &amp; matches</h2>
      <button class="add-btn" onclick="openModal()">+ Add a dog</button>
    </div>
    <div id="dogs"></div>

    <p class="footer-note">Tether · live database · 2026</p>
  </div>

  <!-- ADD A DOG MODAL -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2>Add a dog</h2>
      <div class="two-col">
        <div class="field"><label>Name *</label><input type="text" id="d-name"></div>
        <div class="field"><label>Age (years)</label><input type="number" id="d-age" min="0" max="25"></div>
        <div class="field"><label>Gender</label>
          <select id="d-gender"><option value="M">Male</option><option value="F">Female</option></select></div>
        <div class="field"><label>Size</label>
          <select id="d-size"><option>small</option><option selected>medium</option><option>large</option></select></div>
        <div class="field"><label>Energy (1–5)</label><input type="number" id="d-energy" min="1" max="5" value="3"></div>
        <div class="field"><label>Ok alone (hours)</label><input type="number" id="d-alone" min="0" max="12" value="4"></div>
      </div>
      <div class="field"><label>Good with</label>
        <div class="check-line">
          <label><input type="checkbox" id="d-kids"> Kids</label>
          <label><input type="checkbox" id="d-cats"> Cats</label>
          <label><input type="checkbox" id="d-dogs"> Dogs</label>
        </div>
      </div>
      <div class="two-col">
        <div class="field"><label>Experience needed</label>
          <select id="d-exp"><option>first-time</option><option selected>some</option><option>experienced</option></select></div>
        <div class="field"><label>Urgency</label>
          <select id="d-urgency"><option value="">None</option><option value="medical">Medical</option><option value="kennel stress">Kennel stress</option><option value="capacity">Capacity emergency</option></select></div>
      </div>
      <div class="field"><label>Bio</label><textarea id="d-bio" placeholder="Who is this dog? Their story, their quirks, what home fits them..."></textarea></div>
      <div class="field">
        <label>Vaccinations</label>
        <div id="vax-rows"></div>
        <button class="small-x" style="border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600;" onclick="addVaxRow()">+ Add vaccination</button>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" id="save-dog" onclick="saveDog()">Save dog</button>
      </div>
    </div>
  </div>

  <script>
    const TODAY = new Date();
  let dogsData = [], fostersData = [], vaxData = [], matchesData = [];

    // ---------- LOAD EVERYTHING ----------
    async function loadAll() {
      cconst [dogsRes, fostersRes, vaxRes, matchesRes] = await Promise.all([
        db.from('dogs').select('*').eq('status', 'available').order('created_at', { ascending: false }),
        db.from('fosters').select('*'),
       db.from('vaccinations').select('*'),
        db.from('matches').select('*')
      ]);
      ]);
      dogsData = dogsRes.data || [];
      fostersData = fostersRes.data || [];
      vaxData = vaxRes.data || [];
      matchesData = matchesRes.data || [];
      render();
    }

    // ---------- MATCHING (unchanged spec, vetting enforced) ----------
    function hardFilter(dog, f) {
const kidsPresent = (f.kids && f.kids !== 'No kids' && f.kids !== 'Teens only') || f.visitor_kids;
      const dogsPresent = (f.has_dogs && f.has_dogs !== 'None') || f.visitor_dogs;
      const catsPresent = (f.has_cats && f.has_cats !== 'None') || f.visitor_cats;
      if (!dog.ok_kids && kidsPresent) return "kids";
      if (!dog.ok_cats && catsPresent) return "cats";
      if (!dog.ok_dogs && dogsPresent) return "dogs";
      if (f.allergies) return "allergies";
      if (dog.exp_needed === "experienced" && f.foster_count === null && f.training === null) return "experience";
      if (f.landlord_ok === 'No') return "landlord";
      return null;
    }
    function softScore(dog, f) {
      let pts = 0;
      const energyPref = f.energy_pref || 3;
      const eDiff = Math.abs((dog.energy || 3) - energyPref);
      pts += Math.max(0, 15 - eDiff * 5);
      const aloneMap = { '0-2': 1, '2-4': 3, '4-6': 5, '6-8': 7, '8+': 9 };
      const fAlone = aloneMap[f.alone_hours] || 5;
      pts += (fAlone <= (dog.alone_tolerance || 4)) ? 10 : Math.max(0, 10 - (fAlone - dog.alone_tolerance) * 3);
      pts += 25; // household compat survived hard filters
      const sizeOk = !f.size_pref || f.size_pref === 'No preference' || f.size_pref.toLowerCase() === dog.size;
      pts += sizeOk ? 12 : 6;
      pts += 8;
      const rank = { "first-time": 1, "some": 2, "experienced": 3, "professional": 3 };
      pts += (rank[f.training] || 1) >= (rank[dog.exp_needed] || 1) ? 15 : 7;
      const gOk = !f.gender_pref || f.gender_pref === 'No preference' || f.gender_pref[0] === dog.gender;
      pts += gOk ? 5 : 2;
      const ageBand = dog.age <= 1 ? "Puppy" : dog.age <= 3 ? "Young" : dog.age <= 8 ? "Adult" : "Senior";
      const aOk = !f.age_pref || f.age_pref === 'No preference' || f.age_pref.startsWith(ageBand);
      pts += aOk ? 5 : 2;
      return Math.min(100, Math.round(pts));
    }
    function matchesFor(dog) {
      const threshold = dog.urgency ? 60 : 75;
      return fostersData
        .filter(f => f.vet_status === 'vetted')
        .map(f => {
          if (hardFilter(dog, f)) return null;
          let score = softScore(dog, f);
          let boosted = false;
          if (dog.urgency && f.emergency) { score = Math.min(100, score + 5); boosted = true; }
          return { foster: f, score, boosted };
        })
        .filter(m => m && m.score >= threshold)
        .sort((a, b) => b.score - a.score);
    }

    // ---------- VETTING ACTIONS ----------
    async function setVetStatus(fosterId, status) {
      const { data: { session } } = await db.auth.getSession();
      await db.from('fosters').update({
        vet_status: status,
        vetted_by: session?.user?.email || 'unknown',
        vetted_at: new Date().toISOString()
      }).eq('id', fosterId);
      loadAll();
    }

    // ---------- DOG STATUS ----------
    async function markDogPlaced(dogId) {
      if (!confirm('Mark this dog as placed? They will leave the active list.')) return;
      await db.from('dogs').update({ status: 'placed' }).eq('id', dogId);
      loadAll();
    }

    // ---------- MATCH LIFECYCLE (persists to database) ----------
    const LIFECYCLE = ['matched', 'contacted', 'placed', 'finished'];
    async function advanceMatch(dogId, fosterId, currentStatus) {
      const next = LIFECYCLE[(LIFECYCLE.indexOf(currentStatus) + 1) % LIFECYCLE.length];
      const { data: existing } = await db.from('matches')
        .select('id').eq('dog_id', dogId).eq('foster_id', fosterId).maybeSingle();
      if (existing) {
        await db.from('matches').update({ status: next }).eq('id', existing.id);
      } else {
        await db.from('matches').insert({ dog_id: dogId, foster_id: fosterId, status: next });
      }
      if (next === 'placed') await db.from('dogs').update({ status: 'placed' }).eq('id', dogId);
      loadAll();
    }

    // ---------- VAX STATUS ----------
    function vaxStatus(expires) {
      if (!expires) return { cls: "vax-ok", label: "no expiry set" };
      const days = Math.floor((new Date(expires) - TODAY) / 86400000);
      if (days < 0) return { cls: "vax-expired", label: "EXPIRED " + Math.abs(days) + "d ago" };
      if (days <= 30) return { cls: "vax-soon", label: "expires in " + days + "d" };
      return { cls: "vax-ok", label: "current" };
    }

    // ---------- RENDER ----------
    function render() {
      const pending = fostersData.filter(f => f.vet_status === 'pending');
      const vetted = fostersData.filter(f => f.vet_status === 'vetted');
      const vaxAlerts = vaxData.filter(v => {
        if (!v.expires) return false;
        return Math.floor((new Date(v.expires) - TODAY) / 86400000) <= 30;
      }).length;

      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${dogsData.length}</div><div class="label">Dogs available</div></div>
        <div class="stat"><div class="num">${vetted.length}</div><div class="label">Vetted fosters</div></div>
        <div class="stat"><div class="num">${pending.length}</div><div class="label">Pending review</div></div>
        <div class="stat"><div class="num">${vaxAlerts}</div><div class="label">Vaccination alerts</div></div>`;

      document.getElementById("pending").innerHTML = pending.length === 0
        ? `<div class="empty-state">No pending foster signups. New signups from the website appear here for review.</div>`
        : pending.map(f => `
          <div class="pending-card">
            <div class="dog-head">
              <div>
                <div class="dog-name" style="font-size:16px;">${f.name || 'Unnamed'}</div>
                <div class="pending-info">
                  ${f.city || '?'}, ${f.state || '?'} · ${f.housing || '?'} · ${f.yard || 'yard unknown'} · ${f.rent_own === 'rent' ? 'Rents (landlord: ' + (f.landlord_ok || '?') + ')' : 'Owns'}<br>
                  Kids: ${f.kids || '?'} · Dogs: ${f.has_dogs || '?'} · Cats: ${f.has_cats || '?'} · Allergies: ${f.allergies ? 'YES' : 'no'}<br>
                  Fostered: ${f.foster_count || '?'} · Training: ${f.training || '?'} · Rehomed before: ${f.rehomed_before || 'not answered'}<br>
                  Vet: ${f.vet_contact || 'not provided'} · Day/night: ${f.day_night_plan || '—'} · Travel: ${f.travel_plan || '—'}
                  ${f.notes ? '<br>Notes: ' + f.notes : ''}
                </div>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="approve-btn" onclick="setVetStatus('${f.id}', 'vetted')">Approve</button>
                <button class="decline-btn" onclick="setVetStatus('${f.id}', 'declined')">Decline</button>
              </div>
            </div>
          </div>`).join('');

      document.getElementById("dogs").innerHTML = dogsData.length === 0
        ? `<div class="empty-state">No dogs yet. Click "+ Add a dog" to add your first — matches compute instantly.</div>`
        : dogsData.map(dog => {
          const list = matchesFor(dog);
          const dogVax = vaxData.filter(v => v.dog_id === dog.id);
          return `
          <div class="dog-card">
            <div class="dog-head">
              <div>
                <div class="dog-name">${dog.name}</div>
                <div class="dog-meta">${dog.size || '?'} · ${dog.gender || '?'} · age ${dog.age ?? '?'} · energy ${dog.energy ?? '?'}/5 · ok alone ${dog.alone_tolerance ?? '?'}h · needs ${dog.exp_needed || '?'} foster</div>
                ${dog.bio ? `<div class="dog-bio">${dog.bio}</div>` : ''}
              </div>
<div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
                <span class="badge ${dog.urgency ? "urgent" : "standard"}">${dog.urgency ? "URGENT — " + dog.urgency : "Standard"}</span>
                <button class="decline-btn" style="background:#ddebfa; color:#1f4d7a;" onclick="markDogPlaced('${dog.id}')">Mark placed</button>
              </div>            </div>
            ${dogVax.length ? `<div class="vax"><div class="vax-title">Vaccinations</div>
              ${dogVax.map(v => { const s = vaxStatus(v.expires); return `<div class="vax-row"><span style="font-weight:600;">${v.name}</span><span style="color:#6a706a;">${v.expires || '—'} · <span class="${s.cls}">${s.label}</span></span></div>`; }).join('')}
            </div>` : ''}
            <div class="matches">
              <div class="matches-label">Matches above ${dog.urgency ? 60 : 75}% (vetted fosters only)</div>
              ${list.length === 0
                ? `<div class="no-match">No vetted fosters above threshold yet.</div>`
                : list.map(m => `
                  <div class="match-row">
                    <div class="match-info">
                      <div class="fname">${m.foster.name} ${m.boosted ? '<span class="boost-tag">+5 emergency</span>' : ""}</div>
                      <div class="fdetail">${m.foster.city || '?'}, ${m.foster.state || '?'} · ${m.foster.housing || '?'} · ${m.foster.training || '?'} · away ${m.foster.alone_hours || '?'}h/day</div>
                    </div>
                    <span class="score ${m.score >= 80 ? "high" : "mid"}">${m.score}</span>
                  </div>`).join('')}
            </div>
          </div>`;
        }).join('');
    }

    // ---------- ADD A DOG ----------
    function openModal() { document.getElementById('modal-bg').style.display = 'flex'; if (!document.querySelector('.vax-add-row')) addVaxRow(); }
    function closeModal() { document.getElementById('modal-bg').style.display = 'none'; }
    function addVaxRow() {
      const row = document.createElement('div');
      row.className = 'vax-add-row';
      row.innerHTML = `
        <div class="field" style="margin:0;"><label>Vaccine</label><input type="text" class="vx-name" placeholder="Rabies"></div>
        <div class="field" style="margin:0;"><label>Given</label><input type="date" class="vx-given"></div>
        <div class="field" style="margin:0;"><label>Expires</label><input type="date" class="vx-exp"></div>
        <button class="small-x" onclick="this.parentElement.remove()">✕</button>`;
      document.getElementById('vax-rows').appendChild(row);
    }
    async function saveDog() {
      const name = document.getElementById('d-name').value.trim();
      if (!name) { alert('Dog needs a name.'); return; }
      const btn = document.getElementById('save-dog');
      btn.disabled = true; btn.textContent = 'Saving...';

      const { data: dog, error } = await db.from('dogs').insert({
        name,
        age: parseInt(document.getElementById('d-age').value) || null,
        gender: document.getElementById('d-gender').value,
        size: document.getElementById('d-size').value,
        energy: parseInt(document.getElementById('d-energy').value) || 3,
        alone_tolerance: parseInt(document.getElementById('d-alone').value) || 4,
        ok_kids: document.getElementById('d-kids').checked,
        ok_cats: document.getElementById('d-cats').checked,
        ok_dogs: document.getElementById('d-dogs').checked,
        exp_needed: document.getElementById('d-exp').value,
        urgency: document.getElementById('d-urgency').value || null,
        bio: document.getElementById('d-bio').value.trim() || null
      }).select().single();

      if (error) { alert('Error saving: ' + error.message); btn.disabled = false; btn.textContent = 'Save dog'; return; }

      const vaxRows = [...document.querySelectorAll('.vax-add-row')]
        .map(r => ({
          dog_id: dog.id,
          name: r.querySelector('.vx-name').value.trim(),
          date_given: r.querySelector('.vx-given').value || null,
          expires: r.querySelector('.vx-exp').value || null
        }))
        .filter(v => v.name);
      if (vaxRows.length) await db.from('vaccinations').insert(vaxRows);

      btn.disabled = false; btn.textContent = 'Save dog';
      closeModal();
      document.querySelectorAll('#modal-bg input, #modal-bg textarea').forEach(el => { if (el.type === 'checkbox') el.checked = false; else el.value = ''; });
      document.getElementById('vax-rows').innerHTML = '';
      loadAll();
    }

    loadAll();
  </script>
</body>
</html>
