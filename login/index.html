<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Tether</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf8f2; color: #2a2e2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 420px; width: 100%; text-align: center; }
    h1 { font-family: "Fraunces", serif; font-size: 40px; font-weight: 700; margin-bottom: 8px; }
    .sub { font-size: 15px; color: #4a504a; margin-bottom: 28px; }
    .google-btn { display: inline-flex; align-items: center; gap: 10px; background: #2a2e2a; color: #faf8f2;
      font-size: 15px; font-weight: 600; font-family: inherit; padding: 14px 26px; border: none; border-radius: 999px; cursor: pointer; }
    .google-btn:hover { background: #1a1d1a; }
    .hidden { display: none; }
    .email-pill { display: inline-block; background: #c2edca; color: #1f3a25; font-size: 14px; font-weight: 600;
      padding: 8px 18px; border-radius: 999px; margin-bottom: 18px; }
    .role-tag { display: inline-block; background: #f3efe5; color: #6a706a; font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 999px; margin-bottom: 16px; }
    .go-btn { display: inline-block; background: #1f7a36; color: #faf8f2; font-size: 15px; font-weight: 600;
      text-decoration: none; padding: 14px 28px; border-radius: 999px; margin-bottom: 8px; }
    .go-btn:hover { background: #17612b; }
    .notauth { background: #fde2e2; color: #8a1f1f; border-radius: 12px; padding: 16px 18px; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .signout { background: transparent; border: 1px solid #d8d4c8; color: #4a504a; font-size: 13px; font-weight: 600;
      font-family: inherit; padding: 8px 18px; border-radius: 999px; cursor: pointer; margin-top: 14px; }
    .note { font-size: 12px; color: #8a908a; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tether</h1>

    <div id="signed-out">
      <p class="sub">Sign in to continue.</p>
      <button class="google-btn" onclick="signIn()">Sign in with Google →</button>
      <p class="note">Access is limited to authorized Tether, shelter, and foster accounts.</p>
    </div>

    <div id="signed-in" class="hidden">
      <div class="email-pill" id="user-email"></div>
      <div id="role-area"></div>
      <button class="signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==== copy these two lines from foster/index.html ====
    const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";
    // =====================================================
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function signIn() {
      await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://tether-website-8cv.pages.dev/login' }
      });
    }
    async function signOut() {
      await db.auth.signOut();
      location.reload();
    }

    async function resolveRole(email) {
      const { data: roleRow } = await db.from('user_roles').select('*').eq('email', email).maybeSingle();
      if (roleRow) return roleRow;
      const { data: fosterRow } = await db.from('fosters').select('id').eq('email', email).maybeSingle();
      if (fosterRow) return { role: 'foster' };
      return null;
    }

    async function showSession(session) {
      if (!session) return;
      document.getElementById('signed-out').classList.add('hidden');
      document.getElementById('signed-in').classList.remove('hidden');
      document.getElementById('user-email').textContent = session.user.email;

      const area = document.getElementById('role-area');
      area.innerHTML = `<div class="role-tag">checking access...</div>`;
      const roleRow = await resolveRole(session.user.email);

      if (!roleRow) {
        area.innerHTML = `<div class="notauth">This account isn't authorized yet. If you're a shelter partner or foster, contact <strong>hello.tether.dog@gmail.com</strong> and we'll set you up.</div>`;
      } else if (roleRow.role === 'admin') {
        area.innerHTML = `<div class="role-tag">Tether admin</div><br><a class="go-btn" href="/dashboard">Go to dashboard →</a>`;
      } else if (roleRow.role === 'shelter') {
        area.innerHTML = `<div class="role-tag">Shelter partner</div><br><a class="go-btn" href="/dashboard">Go to dashboard →</a>`;
      } else if (roleRow.role === 'foster') {
        area.innerHTML = `<div class="role-tag">Foster</div><br><a class="go-btn" href="/my">Go to my fosters →</a>`;
      }
    }

    db.auth.getSession().then(({ data: { session } }) => showSession(session));
    db.auth.onAuthStateChange((event, session) => showSession(session));
  </script>
</body>
</html>
